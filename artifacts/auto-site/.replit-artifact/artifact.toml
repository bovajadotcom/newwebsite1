kind = "web"
previewPath = "/"
title = "Automotive Premium Website"
version = "1.0.0"
id = "artifacts/auto-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20766

[services.development]
run = "pnpm --filter @workspace/auto-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auto-site", "run", "build" ]
publicDir = "artifacts/auto-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20766"
BASE_PATH = "/"
